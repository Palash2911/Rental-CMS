name: rental-cms

services:
  redis:
    image: redis:latest
    container_name: rental-cms-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required in docker/.env}
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Throwaway database for `yarn test` only, started with `--profile test`.
  # Same major version as the Neon dev database (17.12). Durability is switched off and the
  # data lives in tmpfs, so every start is empty: run `yarn test:db:migrate` after each `up`.
  postgres-test:
    image: postgres:17.12-alpine
    container_name: rental-cms-postgres-test
    profiles: ["test"]
    restart: "no"
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:?TEST_POSTGRES_USER is required in docker/.env}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?TEST_POSTGRES_PASSWORD is required in docker/.env}
      POSTGRES_DB: ${TEST_POSTGRES_DB:?TEST_POSTGRES_DB is required in docker/.env}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  redis-data:

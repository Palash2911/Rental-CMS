version: "3.9"

services:
  postgres:
    image: postgres
    container_name: rental_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rental_user
      POSTGRES_PASSWORD: rental_password
      POSTGRES_DB: rental_db
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis
    container_name: rental_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: